name: recovery drill

on:
  schedule:
    - cron: "19 8 1 */3 *"
  workflow_dispatch:
    inputs:
      inspect-state:
        description: Inspect the primary state bucket without modifying it.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          test -s docs/first-apply.md
          test -s docs/state-recovery.md
          test -s docs/break-glass.md
          test -s test/clean-room-recovery.md
          bash scripts/verify-no-local-state.sh
          bash scripts/verify-wif-policy.sh

  inspect-state:
    if: inputs.inspect-state == true
    environment: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_BOOTSTRAP_PLAN }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3
      - name: Verify state bucket metadata and readable objects
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          REPLICA_BUCKET: ${{ vars.TFSTATE_REPLICA_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          test -n "$REPLICA_BUCKET"
          gcloud storage buckets describe "gs://${STATE_BUCKET}" --format='yaml(name,location,versioning_enabled,soft_delete_policy)'
          gcloud storage ls --all-versions "gs://${STATE_BUCKET}/bootstrap/**" | sed -n '1,20p'
          gcloud storage buckets describe "gs://${REPLICA_BUCKET}" --format='yaml(name,location,versioning_enabled,soft_delete_policy)'
          gcloud storage ls --all-versions "gs://${REPLICA_BUCKET}/bootstrap/**" | sed -n '1,20p'
