name: recovery drill

on:
  schedule:
    - cron: "19 8 1 */3 *"
  workflow_dispatch:
    inputs:
      inspect-state:
        description: Inspect state and prove the plan identity cannot write non-lock objects.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          test -s docs/first-apply.md
          test -s docs/state-recovery.md
          test -s docs/break-glass.md
          test -s test/clean-room-recovery.md
          bash scripts/verify-no-local-state.sh
          python3 scripts/verify-wif-policy.py

  inspect-state:
    if: inputs.inspect-state == true
    environment: bootstrap-recovery-read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the protected main ref before cloud authentication
        run: |
          if ! [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "::error::State inspection runs only from refs/heads/main."
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_BOOTSTRAP_PLAN }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3
      - name: Verify state bucket metadata and readable objects
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          REPLICA_BUCKET: ${{ vars.TFSTATE_REPLICA_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          test -n "$REPLICA_BUCKET"
          gcloud storage buckets describe "gs://${STATE_BUCKET}" --format='yaml(name,location,versioning_enabled,soft_delete_policy)'
          gcloud storage ls --all-versions "gs://${STATE_BUCKET}/bootstrap/**" | sed -n '1,20p'
          gcloud storage buckets describe "gs://${REPLICA_BUCKET}" --format='yaml(name,location,versioning_enabled,soft_delete_policy)'
          gcloud storage ls --all-versions "gs://${REPLICA_BUCKET}/bootstrap/**" | sed -n '1,20p'
      - name: Prove non-lock state writes are denied
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: |
          set -euo pipefail
          probe="gs://${STATE_BUCKET}/bootstrap/negative-write-probe.tfstate"

          set +e
          describe_output="$(gcloud storage objects describe "$probe" 2>&1)"
          describe_status=$?
          set -e
          if [ "$describe_status" -eq 0 ]; then
            echo "::error::The negative-write probe object already exists; refusing to overwrite it."
            exit 1
          fi
          if ! grep -Eiq '404|not found|no urls matched' <<<"$describe_output"; then
            echo "::error::Could not establish that the negative-write probe path is absent."
            printf '%s\n' "$describe_output" >&2
            exit 1
          fi

          set +e
          upload_output="$(printf '%s\n' 'mindclade-negative-write-probe' | gcloud storage cp - "$probe" 2>&1)"
          upload_status=$?
          set -e
          if [ "$upload_status" -eq 0 ]; then
            set +e
            cleanup_output="$(gcloud storage rm "$probe" 2>&1)"
            cleanup_status=$?
            set -e
            if [ "$cleanup_status" -ne 0 ]; then
              echo "::error::CRITICAL: plan identity wrote a state-like object and cleanup failed."
              printf '%s\n' "$cleanup_output" >&2
            else
              echo "::error::Plan identity unexpectedly wrote a state-like object; the probe was deleted."
            fi
            exit 1
          fi
          if ! grep -Eiq '403|forbidden|permission|storage\.objects\.create|denied' <<<"$upload_output"; then
            echo "::error::Negative-write probe failed for a reason other than an IAM denial."
            printf '%s\n' "$upload_output" >&2
            exit 1
          fi
          echo "Plan identity was denied non-lock object creation as required."
