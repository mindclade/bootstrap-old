---
name: drift

on:
  schedule:
    - cron: "51 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-drift
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
  TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
  TF_VAR_bootstrap_folder_id: ${{ vars.BOOTSTRAP_FOLDER_ID || '' }}
  TF_VAR_prefix: ${{ vars.RESOURCE_PREFIX || 'mc' }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_VAR_state_bucket_location: ${{ vars.STATE_BUCKET_LOCATION || 'US' }}
  TF_VAR_state_kms_location: ${{ vars.STATE_KMS_LOCATION || 'us' }}
  TF_VAR_state_replica_location: ${{ vars.STATE_REPLICA_LOCATION || 'europe-west4' }}
  TF_VAR_state_replica_kms_location: ${{ vars.STATE_REPLICA_KMS_LOCATION || 'europe-west4' }}
  TF_VAR_github_org: ${{ vars.GITHUB_ORG || 'Mindclade' }}
  TF_VAR_github_org_id: ${{ vars.GITHUB_ORG_ID }}
  TF_VAR_github_repository_ids: ${{ vars.GITHUB_REPOSITORY_IDS_JSON }}
  TF_VAR_enable_buildkite_wif: ${{ vars.ENABLE_BUILDKITE_WIF || 'false' }}
  TF_VAR_buildkite_organization_id: ${{ vars.BUILDKITE_ORGANIZATION_ID || '' }}
  TF_VAR_buildkite_pipeline_ids: ${{ vars.BUILDKITE_PIPELINE_IDS_JSON || '[]' }}
  TF_VAR_break_glass_principals: ${{ vars.BREAK_GLASS_PRINCIPALS_JSON || '[]' }}
  TF_VAR_security_contact: ${{ vars.SECURITY_CONTACT || 'security@mindclade.com' }}

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_BOOTSTRAP_DRIFT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
      - id: plan
        name: Detect drift
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color > drift.txt 2>&1
          code=$?
          set -e
          case "$code" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) cat drift.txt; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bootstrap-drift-${{ github.run_id }}
          path: drift.txt
          if-no-files-found: error
          retention-days: 7
      - name: Maintain drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.plan.outputs.drift }}
        run: |
          set -euo pipefail
          marker='<!-- mindclade-bootstrap-drift -->'
          issue="$(gh issue list --state open --search "$marker in:body" --json number --jq '.[0].number // empty')"
          if [[ "$DRIFT" == false ]]; then
            if [[ -n "$issue" ]]; then gh issue close "$issue" --comment 'Drift is clean again.'; fi
            exit 0
          fi
          {
            echo "$marker"
            echo '## Ring-0 drift detected'
            echo
            echo 'The live Ring-0 estate differs from Git. Review the protected workflow run and cloud audit logs before reconciling.'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '> The raw plan is intentionally not copied into an issue because Terraform plans can contain sensitive infrastructure metadata.'
          } > body.md
          if [[ -n "$issue" ]]; then gh issue edit "$issue" --body-file body.md; else gh issue create --title 'Ring-0 infrastructure drift' --label drift --label security --body-file body.md; fi
