name: apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: Permit a reviewed Ring-0 deletion or replacement in this exact plan.
        required: false
        type: boolean
        default: false
      change_reference:
        description: Required incident/change identifier for destructive work or source rollback.
        required: false
        type: string
        default: ""
      source_rollback:
        description: Explicitly plan an older reviewed source commit for emergency rollback.
        required: false
        type: boolean
        default: false
      source_rollback_sha:
        description: Full strict-ancestor commit SHA; valid only when source_rollback is true.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bootstrap-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
  TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
  TF_VAR_bootstrap_folder_id: ${{ vars.BOOTSTRAP_FOLDER_ID }}
  TF_VAR_prefix: ${{ vars.RESOURCE_PREFIX }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_residency_profile: ${{ vars.RESIDENCY_PROFILE }}
  TF_VAR_state_bucket_location: ${{ vars.STATE_BUCKET_LOCATION }}
  TF_VAR_state_kms_location: ${{ vars.STATE_KMS_LOCATION }}
  TF_VAR_automation_secret_location: ${{ vars.AUTOMATION_SECRET_LOCATION }}
  TF_VAR_state_replica_location: ${{ vars.STATE_REPLICA_LOCATION }}
  TF_VAR_state_replica_kms_location: ${{ vars.STATE_REPLICA_KMS_LOCATION }}
  TF_VAR_preserve_legacy_eu_state_replicas: ${{ vars.PRESERVE_LEGACY_EU_STATE_REPLICAS }}
  TF_VAR_state_soft_delete_days: ${{ vars.STATE_SOFT_DELETE_DAYS }}
  TF_VAR_noncurrent_version_days: ${{ vars.NONCURRENT_VERSION_DAYS }}
  TF_VAR_noncurrent_version_count: ${{ vars.NONCURRENT_VERSION_COUNT }}
  TF_VAR_kms_protection_level: ${{ vars.KMS_PROTECTION_LEVEL }}
  TF_VAR_github_org: ${{ vars.GH_ORGANIZATION }}
  TF_VAR_github_org_id: ${{ vars.GH_ORGANIZATION_ID }}
  TF_VAR_github_repository_ids: ${{ vars.GH_REPOSITORY_IDS_JSON }}
  TF_VAR_break_glass_principals: ${{ vars.BREAK_GLASS_PRINCIPALS_JSON }}
  TF_VAR_security_contact: ${{ vars.SECURITY_CONTACT }}

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
      default_head_sha: ${{ steps.guard.outputs.default_head_sha }}
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: guard
        name: Resolve current protected source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          python3 scripts/validate-protected-run.py source \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-ref "$GITHUB_REF" \
            --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" \
            --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" \
            --git-root . \
            --github-output "$GITHUB_OUTPUT"

  plan:
    needs: source
    environment: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      destructive: ${{ steps.classify.outputs.destructive }}
      delete_count: ${{ steps.classify.outputs.delete_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.source.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact triggering commit
        env:
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Check out current guard implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .protected-run-control
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected Terraform input contract before authentication
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: python3 .protected-run-control/scripts/validate-ci-config.py --require-state-bucket
      - name: Revalidate protected source before plan authentication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          python3 .protected-run-control/scripts/validate-protected-run.py check-source \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root .protected-run-control \
            --expected-target-sha "$TARGET_SHA" --expected-default-head-sha "$DEFAULT_HEAD_SHA" \
            --expected-mode "$MODE"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_BOOTSTRAP_PLAN }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
      - name: Plan exact merged commit
        env:
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=20m -out=tfplan
          sha256sum tfplan > tfplan.sha256
          python3 .protected-run-control/scripts/validate-protected-run.py record-plan \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --event-sha "$GITHUB_SHA" --target-sha "$TARGET_SHA" \
            --default-head-sha "$DEFAULT_HEAD_SHA" --mode "$MODE" \
            --output protected-run.json
          sha256sum protected-run.json > protected-run.sha256
      - id: classify
        name: Classify destructive operations
        run: |
          set -euo pipefail
          terraform show -json tfplan > "${RUNNER_TEMP}/tfplan.json"
          delete_count="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "${RUNNER_TEMP}/tfplan.json")"
          create_count="$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' "${RUNNER_TEMP}/tfplan.json")"
          update_count="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "${RUNNER_TEMP}/tfplan.json")"
          destructive=false
          if [ "$delete_count" -gt 0 ]; then destructive=true; fi
          echo "destructive=${destructive}" >> "$GITHUB_OUTPUT"
          echo "delete_count=${delete_count}" >> "$GITHUB_OUTPUT"
          {
            echo '## Ring-0 plan classification'
            echo
            echo "Target commit: \`${{ needs.source.outputs.target_sha }}\`"
            echo
            echo "| Creates | Updates | Deletes/replacements |"
            echo "|---:|---:|---:|"
            echo "| ${create_count} | ${update_count} | ${delete_count} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bootstrap-plan-${{ needs.source.outputs.target_sha }}
          path: |
            tfplan
            tfplan.sha256
            protected-run.json
            protected-run.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Require explicit destructive-change authorization
        if: steps.classify.outputs.destructive == 'true'
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy || false }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "$ALLOW_DESTROY" != "true" ]; then
            echo "::error::Ring-0 plan contains deletions/replacements. Re-run manually with allow_destroy after review."
            exit 1
          fi
          if ! [[ "$CHANGE_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{2,127}$ ]]; then
            echo "::error::A valid incident/change reference is required for destructive Ring-0 work."
            exit 1
          fi
          echo "Authorized destructive change: ${CHANGE_REFERENCE}" >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: [source, plan]
    environment: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.source.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact triggering commit
        env:
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Check out current guard implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .protected-run-control
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected Terraform input contract before authentication
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: python3 .protected-run-control/scripts/validate-ci-config.py --require-state-bucket
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bootstrap-plan-${{ needs.source.outputs.target_sha }}
      - name: Verify plan integrity, freshness, and provenance before authentication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          sha256sum --check tfplan.sha256
          sha256sum --check protected-run.sha256
          python3 .protected-run-control/scripts/validate-protected-run.py validate-plan \
            --metadata protected-run.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root .protected-run-control \
            --expected-target-sha "$TARGET_SHA" --expected-default-head-sha "$DEFAULT_HEAD_SHA" \
            --expected-mode "$MODE"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_APPLY }}
          service_account: ${{ vars.SA_BOOTSTRAP_APPLY }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
      - name: Revalidate protected plan and apply
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.source.outputs.target_sha }}
          DEFAULT_HEAD_SHA: ${{ needs.source.outputs.default_head_sha }}
          MODE: ${{ needs.source.outputs.mode }}
          SOURCE_ROLLBACK: ${{ inputs.source_rollback || false }}
          SOURCE_ROLLBACK_SHA: ${{ inputs.source_rollback_sha || '' }}
          CHANGE_REFERENCE: ${{ inputs.change_reference || '' }}
        run: |
          python3 .protected-run-control/scripts/validate-protected-run.py validate-plan \
            --metadata protected-run.json --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --event-name "$GITHUB_EVENT_NAME" --event-ref "$GITHUB_REF" --event-sha "$GITHUB_SHA" \
            --source-rollback "$SOURCE_ROLLBACK" --source-rollback-sha "$SOURCE_ROLLBACK_SHA" \
            --change-reference "$CHANGE_REFERENCE" --git-root .protected-run-control \
            --expected-target-sha "$TARGET_SHA" --expected-default-head-sha "$DEFAULT_HEAD_SHA" \
            --expected-mode "$MODE"
          terraform apply -input=false -lock-timeout=20m tfplan
      - name: Publish safe output inventory
        run: |
          terraform output -json | jq 'with_entries(.value |= {sensitive: .sensitive, type: .type})' >> "$GITHUB_STEP_SUMMARY"
