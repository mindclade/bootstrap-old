name: plan

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
  TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
  TF_VAR_bootstrap_folder_id: ${{ vars.BOOTSTRAP_FOLDER_ID || '' }}
  TF_VAR_prefix: ${{ vars.RESOURCE_PREFIX || 'mc' }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_VAR_residency_profile: ${{ vars.RESIDENCY_PROFILE || 'us-only-v1' }}
  TF_VAR_state_bucket_location: ${{ vars.STATE_BUCKET_LOCATION || 'US' }}
  TF_VAR_state_kms_location: ${{ vars.STATE_KMS_LOCATION || 'us' }}
  TF_VAR_state_replica_location: ${{ vars.STATE_REPLICA_LOCATION || 'us-east4' }}
  TF_VAR_state_replica_kms_location: ${{ vars.STATE_REPLICA_KMS_LOCATION || 'us-east4' }}
  TF_VAR_github_org: ${{ vars.GH_ORGANIZATION || 'mindclade' }}
  TF_VAR_github_org_id: ${{ vars.GH_ORGANIZATION_ID }}
  TF_VAR_github_repository_ids: ${{ vars.GH_REPOSITORY_IDS_JSON }}
  TF_VAR_enable_buildkite_wif: ${{ vars.ENABLE_BUILDKITE_WIF || 'false' }}
  TF_VAR_buildkite_organization_id: ${{ vars.BUILDKITE_ORGANIZATION_ID || '' }}
  TF_VAR_buildkite_pipeline_ids: ${{ vars.BUILDKITE_PIPELINE_IDS_JSON || '[]' }}
  TF_VAR_buildkite_pipeline_step_contracts: ${{ vars.BUILDKITE_PIPELINE_STEP_CONTRACTS_JSON || '{}' }}
  TF_VAR_break_glass_principals: ${{ vars.BREAK_GLASS_PRINCIPALS_JSON || '[]' }}
  TF_VAR_security_contact: ${{ vars.SECURITY_CONTACT || 'security@mindclade.com' }}

jobs:
  detect:
    name: detect connected-plan scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.classify.outputs.should-run }}
    steps:
      - name: Check out credential-free source for change detection
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        name: Classify connected-plan scope
        env:
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVENT_ACTION" = closed ]; then
            should_run=false
          else
            should_run="$(python3 scripts/classify-plan-change.py \
              --event-name "$EVENT_NAME" \
              --event-action "$EVENT_ACTION" \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA")"
          fi
          case "$should_run" in
            true|false) ;;
            *) echo "::error::change classifier returned an invalid decision"; exit 1 ;;
          esac
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"

  speculative:
    needs: detect
    if: >-
      needs.detect.outputs.should-run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    environment: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_BOOTSTRAP_PLAN }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Verify required configuration
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          REPOSITORY_IDS: ${{ vars.GH_REPOSITORY_IDS_JSON }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          jq -e 'type == "object" and length >= 5' <<< "$REPOSITORY_IDS" >/dev/null
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
      - name: Speculative plan
        run: terraform plan -input=false -lock-timeout=20m -no-color

  verdict:
    name: plan / verdict
    if: always()
    needs: [detect, speculative]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve stable plan verdict
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          PLAN_RESULT: ${{ needs.speculative.result }}
          SHOULD_RUN: ${{ needs.detect.outputs.should-run }}
        run: |
          set -euo pipefail
          if [ "$DETECT_RESULT" != success ]; then
            echo "::error::connected-plan scope detection did not succeed"
            exit 1
          fi
          if [ "$SHOULD_RUN" = false ]; then
            echo "No Terraform, state, trust, or connected-plan control path changed."
            exit 0
          fi
          if [ "$SHOULD_RUN" != true ]; then
            echo "::error::connected-plan scope decision is absent or malformed"
            exit 1
          fi
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::connected speculative plan did not succeed: ${PLAN_RESULT}"
            exit 1
          fi
          echo "Connected speculative plan succeeded."
