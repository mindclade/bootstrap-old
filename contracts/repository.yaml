---
schema_version: 1
repository: bootstrap
repository_class: enterprise-control
visibility: private
github:
    enterprise_url: https://github.com/enterprises/mindclade
    organization_url: https://github.com/mindclade
    repository_index_url: https://github.com/orgs/mindclade/repositories
    repository_url: https://github.com/mindclade/bootstrap
authority:
    - ring0-state
    - automation-federation
    - seed-projects
    - break-glass-recovery
forbidden_authority:
    - normal-folders
    - normal-org-policy
    - workload-projects
    - networks
    - gke
    - kubernetes-desired-state
required_paths:
    - AGENTS.md
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - SUPPORT.md
    - CODE_OF_CONDUCT.md
    - GOVERNANCE.md
    - CHANGELOG.md
    - LEGAL.md
    - LICENSE
    - NOTICE
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/MINDCLADE_PROPRIETARY_SOURCE_HEADER.txt
    - modules/state
    - modules/identity
    - modules/projects
    - modules/naming
    - docs/first-apply.md
    - docs/break-glass.md
    - docs/state-recovery.md
forbidden_paths:
    - modules/folders
    - modules/governance
    - .terraform
    - .terragrunt-cache
default_branch: main
change_model: pull-request
production_controls:
    required_reviews: true
    codeowners: true
    merge_queue: false
    immutable_actions: true
    oidc_only_cloud_authentication: true
